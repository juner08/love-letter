<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#140309" />
<title>A Letter From Your Lover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --burgundy-950: #140309;
    --burgundy-900: #22050f;
    --burgundy-800: #33081a;
    --burgundy-700: #470c24;
    --burgundy-600: #5d1130;
    --rose-600: #9e1848;
    --rose-500: #c01f5e;
    --rose-400: #e0457f;
    --rose-300: #ff6fa5;
    --rose-200: #ffb3d1;
    --pink-100: #ffe4ee;
    --gold-600: #b08a4a;
    --gold-500: #c9a86a;
    --gold-400: #e6cd93;
    --gold-300: #f6e9c6;
    --paper-1: #fffaf5;
    --paper-2: #fff1e9;
    --paper-3: #ffe6e9;
    --ink: #492334;
    --ink-soft: #6b3a52;
    --shadow: 0 30px 70px rgba(0,0,0,0.6);
    --serif: 'Cormorant Garamond', 'Georgia', 'Times New Roman', serif;
    --display: 'Playfair Display', 'Georgia', serif;
    --script: 'Great Vibes', 'Brush Script MT', 'Segoe Script', cursive;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: var(--serif);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    background:
      radial-gradient(1200px 820px at 14% 8%, rgba(230,205,147,0.12), transparent 60%),
      radial-gradient(1000px 760px at 86% 16%, rgba(224,69,127,0.20), transparent 62%),
      radial-gradient(1200px 1000px at 50% 118%, rgba(93,17,48,0.65), transparent 66%),
      linear-gradient(155deg, var(--burgundy-950) 0%, #2c0620 34%, #4a0d2b 62%, var(--burgundy-950) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: default;
    isolation: isolate;
  }

  /* soft ambient light bloom */
  body::before {
    content: '';
    position: fixed;
    inset: -25%;
    background: radial-gradient(closest-side, rgba(255,120,170,0.20), transparent 70%);
    animation: bloom 16s ease-in-out infinite;
    pointer-events: none;
    z-index: -1;
  }

  body::after {
    content: '';
    position: fixed;
    inset: -30%;
    background: radial-gradient(closest-side, rgba(230,205,147,0.14), transparent 72%);
    animation: bloom 22s ease-in-out infinite reverse;
    pointer-events: none;
    z-index: -1;
  }

  @keyframes bloom {
    0%, 100% { transform: scale(1) translate3d(0,0,0); opacity: 0.6; }
    50%      { transform: scale(1.18) translate3d(0,-2%,0); opacity: 1; }
  }

  /* ---------- ambient layers ---------- */
  .layer, .hearts { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  .hearts { z-index: 1; }

  .heart {
    position: absolute;
    bottom: -60px;
    color: var(--rose-300);
    opacity: 0;
    animation: floatUp linear infinite;
    will-change: transform, opacity;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 0; }
    15%  { opacity: 0.85; }
    50%  { transform: translateY(-50vh) scale(1) rotate(200deg); opacity: 0.7; }
    100% { transform: translateY(-115vh) scale(0.7) rotate(360deg); opacity: 0; }
  }

  /* rose petals */
  .petal {
    position: absolute;
    top: -8vh;
    width: 14px; height: 14px;
    background: linear-gradient(135deg, #ff9ec0, #e0457f 55%, #b3184a);
    border-radius: 100% 0 100% 0;
    opacity: 0;
    animation: petalFall linear infinite;
    will-change: transform, opacity;
  }

  @keyframes petalFall {
    0%   { transform: translate3d(0,-10vh,0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.9; }
    50%  { transform: translate3d(6vw,50vh,0) rotate(220deg); }
    90%  { opacity: 0.85; }
    100% { transform: translate3d(-4vw,112vh,0) rotate(420deg); opacity: 0; }
  }

  /* glowing motes */
  .mote {
    position: absolute;
    bottom: -4vh;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff2d0, rgba(230,205,147,0.5) 45%, transparent 70%);
    opacity: 0;
    animation: moteRise linear infinite;
    will-change: transform, opacity;
  }

  @keyframes moteRise {
    0%   { transform: translate3d(0,0,0) scale(0.6); opacity: 0; }
    15%  { opacity: 0.9; }
    85%  { opacity: 0.7; }
    100% { transform: translate3d(2vw,-108vh,0) scale(1.1); opacity: 0; }
  }

  /* tiny stars */
  .star {
    position: absolute;
    width: 2px; height: 2px;
    border-radius: 50%;
    background: #fff6e0;
    box-shadow: 0 0 6px rgba(255,240,200,0.9);
    opacity: 0;
    animation: twinkle ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.8); }
    50%      { opacity: 0.95; transform: scale(1.3); }
  }

  /* ---------- effects layer ---------- */
  .fx { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }

  .spark, .petal-burst {
    position: absolute;
    left: 0; top: 0;
    pointer-events: none;
    user-select: none;
    will-change: transform, opacity;
  }

  .trail {
    position: fixed;
    font-size: 12px;
    color: var(--rose-200);
    pointer-events: none;
    z-index: 39;
  }

  .flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 38;
    opacity: 0;
    background: radial-gradient(circle at 50% 55%, rgba(255,150,190,0.55), rgba(230,205,147,0.18) 40%, transparent 70%);
  }
  .flash.go { animation: flash 1s ease-out; }
  @keyframes flash { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }

  /* ---------- intro envelope ---------- */
  .stage {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 34px;
    padding: 0 20px;
    perspective: 1400px;
    transition: opacity 0.9s ease, transform 0.9s ease, filter 0.9s ease;
  }

  .stage.gone { opacity: 0; transform: scale(0.86) translateY(30px); filter: blur(6px); pointer-events: none; }

  .envelope {
    position: relative;
    width: min(84vw, 390px);
    aspect-ratio: 390 / 250;
    cursor: pointer;
    transform-style: preserve-3d;
    animation: envFloat 4.6s ease-in-out infinite;
    filter: drop-shadow(0 34px 46px rgba(0,0,0,0.55)) drop-shadow(0 0 22px rgba(255,120,170,0.16));
  }

  @keyframes envFloat {
    0%, 100% { transform: translateY(0) rotateZ(-1deg); }
    50%      { transform: translateY(-14px) rotateZ(1deg); }
  }

  .envelope:hover { filter: drop-shadow(0 38px 52px rgba(255,80,140,0.4)) drop-shadow(0 0 30px rgba(255,120,170,0.35)); }

  .env-back {
    position: absolute; inset: 0;
    border-radius: 10px;
    background: linear-gradient(158deg, #fff3ea 0%, #f6d9c7 45%, #ecc2ad 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.6),
      inset 0 0 0 3px rgba(201,168,106,0.5),
      0 2px 0 rgba(255,255,255,0.4);
  }

  .env-note {
    position: absolute; left: 7%; right: 7%; top: 26%; height: 66%;
    background: linear-gradient(180deg, #fffdfb, #fff6ef);
    border-radius: 6px 6px 4px 4px;
    z-index: 1;
    box-shadow: 0 -10px 22px rgba(60,10,40,0.22), inset 0 0 0 1px rgba(201,168,106,0.35);
    transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1) 0.35s;
  }

  .envelope.rising .env-note { transform: translateY(-46%); }

  .env-flap {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 62%;
    background: linear-gradient(165deg, #f8dccb 0%, #eab59e 55%, #dd9a82 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform 1.05s cubic-bezier(0.62, 0.02, 0.3, 1), filter 1.05s ease;
    border-radius: 10px 10px 0 0;
    z-index: 3;
    filter: drop-shadow(0 6px 8px rgba(80,20,40,0.28));
  }

  .env-front {
    position: absolute; bottom: 0; left: 0;
    width: 100%; height: 64%;
    background: linear-gradient(165deg, #f6cfbc 0%, #e9a68d 60%, #db8f76 100%);
    clip-path: polygon(0 0, 50% 50%, 100% 0, 100% 100%, 0 100%);
    border-radius: 0 0 10px 10px;
    z-index: 2;
  }

  .env-front::after {
    content: 'A\2009&\2009Y';
    position: absolute; left: 50%; bottom: 15%;
    transform: translateX(-50%);
    font-family: var(--display);
    letter-spacing: 0.35em;
    font-size: clamp(11px, 3vw, 15px);
    color: rgba(150,60,95,0.55);
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }

  .seal {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -30%);
    width: clamp(54px, 15vw, 66px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #ff7ba3 0%, #cf2358 42%, #8f1140 72%, #5e0a2a 100%);
    box-shadow:
      0 8px 18px rgba(0,0,0,0.5),
      inset 0 -5px 10px rgba(0,0,0,0.4),
      inset 0 4px 8px rgba(255,180,205,0.45),
      0 0 0 1px rgba(230,205,147,0.55);
    display: flex; align-items: center; justify-content: center;
    color: #ffdbe6;
    font-size: clamp(22px, 7vw, 30px);
    z-index: 4;
    animation: sealPulse 3s ease-in-out infinite;
    transition: opacity 0.6s ease, transform 0.6s ease;
    text-shadow: 0 1px 2px rgba(90,10,40,0.6);
  }

  .seal::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(255,90,150,0.5);
    animation: sealRing 3s ease-in-out infinite;
  }

  .seal::after { content: ''; position: absolute; inset: 6px; border-radius: 50%; border: 1px dashed rgba(255,220,235,0.5); }

  @keyframes sealRing {
    0%, 100% { transform: scale(1); opacity: 0.55; }
    50%      { transform: scale(1.55); opacity: 0; }
  }

  @keyframes sealPulse {
    0%, 100% { transform: translate(-50%,-30%) scale(1); }
    50%      { transform: translate(-50%,-30%) scale(1.06); }
  }

  .envelope.open .env-flap { transform: rotateX(180deg); z-index: 0; filter: drop-shadow(0 -6px 10px rgba(80,20,40,0.18)); }
  .envelope.open .seal { opacity: 0; transform: translate(-50%,-30%) scale(0.6); }

  .hint {
    color: var(--gold-300);
    font-family: var(--display);
    letter-spacing: 0.32em;
    font-size: clamp(0.68rem, 2.4vw, 0.82rem);
    text-transform: uppercase;
    text-align: center;
    opacity: 0.85;
    animation: hintPulse 2.6s ease-in-out infinite;
    text-shadow: 0 0 12px rgba(230,205,147,0.35);
    padding: 0 10px;
  }

  @keyframes hintPulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  /* ---------- the letter ---------- */
  .scene {
    perspective: 1800px;
    z-index: 6;
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: clamp(12px, 3.5vw, 34px);
  }

  .scene.show { display: flex; animation: sceneIn 0.9s ease both; }
  @keyframes sceneIn { from { opacity: 0; } to { opacity: 1; } }

  .tilt {
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.35s ease-out;
    will-change: transform;
    border-radius: 10px;
  }

  /* fixed gold frame that does not scroll with the paper */
  .tilt::after {
    content: '';
    position: absolute;
    inset: 10px;
    border-radius: 7px;
    border: 1px solid rgba(201,168,106,0.5);
    box-shadow: inset 0 0 0 6px transparent, inset 0 0 0 7px rgba(201,168,106,0.22);
    pointer-events: none;
    z-index: 3;
  }

  .tilt::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 14px;
    box-shadow: 0 0 70px rgba(255,120,170,0.55);
    opacity: 0;
    pointer-events: none;
    z-index: -1;
  }

  .scene.show .tilt::before { animation: glowPulse 6s ease-in-out infinite; }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }

  .letter {
    width: min(92vw, 600px);
    max-height: 86vh;
    max-height: min(86dvh, 880px);
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,0.7), transparent 55%),
      repeating-linear-gradient(0deg, rgba(120,60,90,0.045) 0px, rgba(120,60,90,0.045) 1px, transparent 1px, transparent 36px),
      linear-gradient(160deg, var(--paper-1) 0%, var(--paper-2) 55%, var(--paper-3) 100%);
    border-radius: 8px;
    padding: clamp(30px, 6vw, 56px) clamp(22px, 6vw, 52px) clamp(38px, 7vw, 58px);
    transform-origin: top center;
    opacity: 0;
    box-shadow: var(--shadow);
  }

  .letter.show {
    animation: unfold 1.35s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes unfold {
    0%   { opacity: 0; transform: translateY(90px) rotateX(-70deg) scale(0.92); }
    55%  { opacity: 1; }
    100% { opacity: 1; transform: translateY(0) rotateX(0) scale(1); }
  }

  .tilt > .seal {
    top: -26px;
    left: 50%;
    width: clamp(50px, 14vw, 60px);
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity 0.9s ease 0.9s;
    animation: sealPulse2 3s ease-in-out infinite;
    cursor: pointer;
    z-index: 5;
  }

  .scene.show .tilt > .seal { opacity: 1; }

  @keyframes sealPulse2 {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50%      { transform: translateX(-50%) scale(1.08); }
  }

  .dear {
    font-family: var(--script);
    font-size: clamp(1.9rem, 6.5vw, 2.6rem);
    color: var(--rose-600);
    margin-bottom: 20px;
    min-height: 1.5rem;
    line-height: 1.15;
  }

  .dear::after {
    content: '';
    display: block;
    width: 68px; height: 2px;
    margin-top: 14px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--gold-500), rgba(201,168,106,0.15));
  }

  .body p {
    font-size: clamp(1.02rem, 2.9vw, 1.12rem);
    line-height: 1.95;
    color: var(--ink);
    margin-bottom: 20px;
    text-align: justify;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  .body p.lit { opacity: 1; transform: none; }

  .typing::after {
    content: '';
    display: inline-block;
    width: 0.55ch; height: 1em;
    margin-left: 0.1em;
    background: var(--rose-500);
    vertical-align: -0.12em;
    border-radius: 1px;
    animation: caret 0.85s step-end infinite;
  }

  @keyframes caret { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .highlight { color: var(--rose-500); font-weight: 600; font-style: italic; }

  .signature {
    margin-top: 30px;
    text-align: right;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 1s ease, transform 1s ease;
  }

  .signature.show { opacity: 1; transform: translateY(0); }

  .signature .words { font-family: var(--display); font-size: 1rem; color: var(--ink-soft); letter-spacing: 0.04em; margin-bottom: 4px; }

  .signature .name {
    font-family: var(--script);
    font-size: clamp(2.2rem, 8vw, 3rem);
    color: var(--rose-600);
    display: inline-block;
    line-height: 1;
    text-shadow: 0 2px 10px rgba(192,31,94,0.18);
    animation: sign 4s ease-in-out infinite;
  }

  .signature .name::after {
    content: '';
    display: block;
    height: 2px;
    margin-top: 4px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, rgba(201,168,106,0.8), transparent);
  }

  @keyframes sign {
    0%, 100% { transform: rotate(-3deg) translateY(0); }
    50%      { transform: rotate(-1.5deg) translateY(-3px); }
  }

  .beat { display: inline-block; color: #ff2e63; animation: beat 1.4s ease-in-out infinite; }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    20%      { transform: scale(1.32); }
    40%      { transform: scale(1); }
    60%      { transform: scale(1.18); }
    80%      { transform: scale(1); }
  }

  /* ---------- secret (long press the seal) ---------- */
  .secret {
    margin-top: 26px;
    padding: 18px 20px;
    border-left: 3px solid var(--gold-500);
    background: linear-gradient(120deg, rgba(255,130,170,0.12), rgba(230,205,147,0.10));
    color: var(--rose-600);
    font-style: italic;
    font-size: 1.02rem;
    line-height: 1.7;
    border-radius: 0 10px 10px 0;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.7s ease, opacity 0.7s ease, padding 0.5s ease;
    padding-top: 0; padding-bottom: 0;
  }

  .secret.show {
    max-height: 300px;
    opacity: 1;
    padding-top: 18px; padding-bottom: 18px;
  }

  /* ---------- proposal twist ---------- */
  .proposal {
    margin-top: 30px;
    text-align: center;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  .proposal.show { opacity: 1; transform: translateY(0); }

  .proposal .q {
    font-family: var(--display);
    font-size: clamp(1.05rem, 3.4vw, 1.3rem);
    color: var(--rose-500);
    margin-bottom: 20px;
    font-style: italic;
    line-height: 1.5;
  }

  .btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; position: relative; }

  .btn {
    position: relative;
    border: none;
    padding: 14px 34px;
    border-radius: 50px;
    font-family: var(--display);
    font-size: 1.02rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.35s ease, left 0.4s cubic-bezier(0.2, 0.8, 0.3, 1), top 0.4s cubic-bezier(0.2, 0.8, 0.3, 1);
  }

  .btn:active { transform: scale(0.96); }

  .btn-yes {
    color: #fff6ee;
    background: linear-gradient(140deg, var(--rose-400), var(--rose-600) 60%, #7d1236);
    box-shadow: 0 14px 30px rgba(150,20,70,0.55), inset 0 0 0 1px rgba(255,220,235,0.5), inset 0 1px 0 rgba(255,255,255,0.5);
  }

  .btn-yes::after {
    content: '';
    position: absolute; top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: skewX(-20deg);
    animation: shine 3.6s ease-in-out infinite;
  }

  @keyframes shine { 0% { left: -60%; } 45% { left: 130%; } 100% { left: 130%; } }

  .btn-yes:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 20px 40px rgba(150,20,70,0.7), inset 0 0 0 1px rgba(255,220,235,0.6), inset 0 1px 0 rgba(255,255,255,0.6);
  }

  .btn-no {
    color: var(--rose-600);
    background: linear-gradient(140deg, #fffdfb, #ffe1ea);
    box-shadow: inset 0 0 0 2px rgba(158,24,72,0.6), 0 8px 18px rgba(120,20,60,0.22);
  }

  .btn-no:hover {
    color: var(--rose-500);
    background: linear-gradient(140deg, #fffdfb, #ffd4e2);
    box-shadow: inset 0 0 0 2px rgba(192,31,94,0.9), 0 10px 24px rgba(120,20,60,0.32);
  }

  .answer {
    margin-top: 12px;
    font-family: var(--script);
    font-size: clamp(1.4rem, 5vw, 1.9rem);
    color: var(--rose-500);
    min-height: 1.6rem;
    text-shadow: 0 2px 14px rgba(192,31,94,0.25);
  }

  .answer.show { animation: answerIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; }
  @keyframes answerIn { from { opacity: 0; transform: translateY(14px) scale(0.9); } to { opacity: 1; transform: none; } }

  /* ---------- music toggle ---------- */
  .music {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    right: max(18px, env(safe-area-inset-right));
    z-index: 70;
    width: 50px; height: 50px;
    border-radius: 50%;
    border: 1px solid rgba(230,205,147,0.55);
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.14), rgba(90,10,50,0.5));
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    gap: 3px;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,180,210,0.25);
    transition: transform 0.25s ease, box-shadow 0.3s ease;
  }

  .music:hover { transform: scale(1.08); box-shadow: 0 10px 26px rgba(0,0,0,0.45), 0 0 22px rgba(255,120,170,0.6); }
  .music.on { box-shadow: 0 10px 26px rgba(0,0,0,0.45), 0 0 26px rgba(255,120,170,0.85); }

  .music .eq { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
  .music .eq i {
    display: block;
    width: 3px; height: 6px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--gold-300), var(--rose-300));
    opacity: 0.7;
    transition: opacity 0.3s ease;
  }

  .music.on .eq i { opacity: 1; animation: eq 1s ease-in-out infinite; }
  .music.on .eq i:nth-child(2) { animation-duration: 0.8s; animation-delay: 0.15s; }
  .music.on .eq i:nth-child(3) { animation-duration: 1.2s; animation-delay: 0.3s; }

  @keyframes eq { 0%, 100% { height: 6px; } 50% { height: 20px; } }

  .letter::-webkit-scrollbar { width: 8px; }
  .letter::-webkit-scrollbar-track { background: transparent; }
  .letter::-webkit-scrollbar-thumb { background: rgba(201,168,106,0.45); border-radius: 8px; }
  .letter::-webkit-scrollbar-thumb:hover { background: rgba(201,168,106,0.7); }

  /* ---------- game button + love game ---------- */
  .ibtn {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    z-index: 70;
    width: 50px; height: 50px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid rgba(230,205,147,0.55);
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.14), rgba(90,10,50,0.5));
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--rose-200);
    box-shadow: 0 8px 22px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,180,210,0.25);
    transition: transform 0.25s ease, box-shadow 0.3s ease;
  }

  .ibtn:hover { transform: scale(1.08); box-shadow: 0 10px 26px rgba(0,0,0,0.45), 0 0 22px rgba(255,120,170,0.6); }
  .ibtn svg { width: 26px; height: 26px; display: block; }

  .game {
    right: calc(max(18px, env(safe-area-inset-right)) + 62px);
    opacity: 0;
    transform: scale(0.4);
    pointer-events: none;
  }

  .game::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(255,120,170,0.5);
  }

  .game.show {
    pointer-events: auto;
    animation: popIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both, gamePulse 2.8s ease-in-out 0.7s infinite;
  }

  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.4) rotate(-20deg); }
    70%  { opacity: 1; transform: scale(1.08) rotate(4deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  @keyframes gamePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,120,170,0.45); }
    50%      { box-shadow: 0 0 0 9px rgba(255,120,170,0); }
  }

  .gameOverlay {
    position: fixed;
    inset: 0;
    z-index: 90;
    display: none;
    background: linear-gradient(160deg, rgba(20,3,9,0.97), rgba(45,8,28,0.98));
    overscroll-behavior: none;
    touch-action: none;
  }

  .gameOverlay.show { display: block; animation: sceneIn 0.5s ease both; }

  .gameCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
  }

  .gameHud {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: clamp(14px, 5vw, 46px);
    align-items: center;
    font-family: var(--display);
    color: var(--gold-300);
    font-size: clamp(0.78rem, 3vw, 1rem);
    letter-spacing: 0.08em;
    padding: 10px 22px;
    border-radius: 40px;
    background: rgba(20,3,9,0.5);
    border: 1px solid rgba(230,205,147,0.35);
    backdrop-filter: blur(6px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    z-index: 2;
    white-space: nowrap;
  }

  .gameHud b { color: #fff; font-weight: 600; }
  .gameHud .gLives { letter-spacing: 2px; font-size: 1.05em; color: var(--rose-300); }

  .gameScreen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    gap: 16px;
    padding: 28px;
    z-index: 3;
    background: radial-gradient(circle at 50% 45%, rgba(20,3,9,0.3), rgba(20,3,9,0.72));
  }

  .gameScreen.hide { display: none; }

  .gameTitle {
    font-family: var(--script);
    font-size: clamp(2.4rem, 12vw, 4.4rem);
    color: var(--rose-300);
    line-height: 1;
    text-shadow: 0 4px 30px rgba(255,90,150,0.5);
  }

  .gameSub {
    font-family: var(--display);
    max-width: 32ch;
    color: var(--gold-300);
    font-size: clamp(0.9rem, 3.4vw, 1.05rem);
    line-height: 1.65;
    opacity: 0.92;
  }

  .gameSub b { color: #fff; }

  .gameBtns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }

  @media (max-width: 520px) {
    .gameHud { gap: 16px; padding: 8px 15px; }
  }

  /* ---------- responsive ---------- */
  @media (max-width: 520px) {
    .letter { width: 94vw; max-height: 90vh; max-height: min(90dvh, 90vh); }
    .scene { padding: 10px; }
    .btns { gap: 12px; }
    .btn { padding: 13px 26px; }
    .tilt::after { inset: 7px; }
  }

  @media (hover: none) {
    .trail { display: none; }
  }

  /* ---------- reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.15s !important;
    }
    .heart, .petal, .mote, .star { display: none !important; }
    .body p { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>

  <div class="hearts" id="hearts"></div>
  <div class="layer" id="petals"></div>
  <div class="layer" id="motes"></div>
  <div class="layer" id="stars"></div>
  <div class="fx" id="fx"></div>
  <div class="flash" id="flash"></div>
  <button class="music" id="music" title="Can't Help Falling In Love &mdash; Violin" aria-label="Toggle music">
    <span class="eq"><i></i><i></i><i></i></span>
  </button>
  <button class="ibtn game" id="game" title="Play a little love game" aria-label="Play a love game">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 20.6s-6.5-4.2-8.8-8.3C1.6 9.4 3.2 6 6.6 6c1.9 0 3.1 1.05 3.9 2.1.55.72.95 1.25 1.5 1.25s.95-.53 1.5-1.25C14.3 7.05 15.5 6 17.4 6c3.4 0 5 3.4 3.4 6.3C18.5 16.4 12 20.6 12 20.6z"
        fill="currentColor" opacity="0.95"/>
      <path d="M10.4 9.6l4.6 2.4-4.6 2.4z" fill="#2a0715"/>
    </svg>
  </button>

  <div class="gameOverlay" id="gameOverlay">
    <canvas class="gameCanvas" id="gameCanvas"></canvas>
    <div class="gameHud">
      <span>Score <b id="gScore">0</b></span>
      <span>Time <b id="gTime">40</b></span>
      <span class="gLives" id="gLives">&#10084;&#10084;&#10084;</span>
    </div>
    <div class="gameScreen" id="gameScreen">
      <h2 class="gameTitle">Catch My Love</h2>
      <p class="gameSub" id="gameSub">Move to catch the falling hearts &amp; petals &mdash; and dodge the broken ones. You have 40 seconds.</p>
      <div class="gameBtns">
        <button class="btn btn-yes" id="gameStart">Start</button>
        <button class="btn btn-no" id="gameClose">Back to letter</button>
      </div>
    </div>
  </div>

  <!-- intro: envelope -->
  <div class="stage" id="stage">
    <div class="envelope" id="envelope">
      <div class="env-back"></div>
      <div class="env-note"></div>
      <div class="env-flap"></div>
      <div class="env-front"></div>
      <div class="seal">&#10084;</div>
    </div>
    <div class="hint" id="hint">A letter from your lover &middot; tap to open</div>
  </div>

  <!-- the letter -->
  <div class="scene" id="scene">
   <div class="tilt" id="tilt">
    <div class="seal" id="seal">&#10084;</div>
    <div class="letter" id="letter">
      <div class="dear" id="dear"></div>
      <div class="body">
        <p id="p1"></p>
        <p id="p2"></p>
        <p id="p3"></p>
        <p id="p4"></p>
      </div>

      <div class="secret" id="secret"></div>

      <div class="signature" id="signature">
        <div class="words">Forever &amp; always yours,</div>
        <div class="name">Your Lover <span class="beat">&#10084;</span></div>
      </div>

      <div class="proposal" id="proposal">
        <div class="q">So tell me&hellip; will you be mine forever?</div>
        <div class="btns" id="btns">
          <button class="btn btn-yes" id="yes">Yes, always &#128149;</button>
          <button class="btn btn-no" id="no">Hmm, no</button>
        </div>
        <div class="answer" id="answer"></div>
      </div>
    </div>
   </div>
  </div>

<script>
(function () {
  'use strict';

  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var isTouch = !!(window.matchMedia && window.matchMedia('(hover: none)').matches);

  /* ============ floating hearts ============ */
  var glyphs = ['\u2764', '\u2665', '\u2765', '\u2764\uFE0F'];
  var heartsBox = document.getElementById('hearts');
  var heartCount = reduceMotion ? 0 : (isTouch ? 10 : 16);
  for (var i = 0; i < heartCount; i++) {
    var h = document.createElement('span');
    h.className = 'heart';
    h.textContent = glyphs[(Math.random() * glyphs.length) | 0];
    h.style.left = (Math.random() * 100) + 'vw';
    h.style.fontSize = (9 + Math.random() * 20) + 'px';
    h.style.animationDuration = (16 + Math.random() * 18) + 's';
    h.style.animationDelay = (Math.random() * 14) + 's';
    h.style.opacity = 0.22 + Math.random() * 0.4;
    heartsBox.appendChild(h);
  }

  /* ============ ambient: rose petals ============ */
  var petalsBox = document.getElementById('petals');
  if (petalsBox && !reduceMotion) {
    var petalCount = isTouch ? 10 : 16;
    for (var pi = 0; pi < petalCount; pi++) {
      var pt = document.createElement('span');
      pt.className = 'petal';
      var ps = 10 + Math.random() * 16;
      pt.style.width = ps + 'px';
      pt.style.height = ps + 'px';
      pt.style.left = (Math.random() * 100) + 'vw';
      pt.style.animationDuration = (12 + Math.random() * 14) + 's';
      pt.style.animationDelay = (-Math.random() * 20) + 's';
      pt.style.opacity = 0.5 + Math.random() * 0.5;
      petalsBox.appendChild(pt);
    }
  }

  /* ============ ambient: glowing motes ============ */
  var motesBox = document.getElementById('motes');
  if (motesBox && !reduceMotion) {
    var moteCount = isTouch ? 7 : 12;
    for (var mi = 0; mi < moteCount; mi++) {
      var mo = document.createElement('span');
      mo.className = 'mote';
      var ms = 3 + Math.random() * 6;
      mo.style.width = ms + 'px';
      mo.style.height = ms + 'px';
      mo.style.left = (Math.random() * 100) + 'vw';
      mo.style.animationDuration = (16 + Math.random() * 16) + 's';
      mo.style.animationDelay = (-Math.random() * 20) + 's';
      motesBox.appendChild(mo);
    }
  }

  /* ============ ambient: twinkling stars ============ */
  var starsBox = document.getElementById('stars');
  if (starsBox && !reduceMotion) {
    var starCount = isTouch ? 12 : 20;
    for (var si = 0; si < starCount; si++) {
      var st = document.createElement('span');
      st.className = 'star';
      st.style.left = (Math.random() * 100) + 'vw';
      st.style.top = (Math.random() * 100) + 'vh';
      st.style.animationDuration = (2.4 + Math.random() * 3.6) + 's';
      st.style.animationDelay = (Math.random() * 4) + 's';
      starsBox.appendChild(st);
    }
  }

  /* ============ helpers: particle effects ============ */
  var fx = document.getElementById('fx');

  function burst(x, y, n) {
    if (reduceMotion) n = Math.min(n, 6);
    for (var i = 0; i < n; i++) {
      var s = document.createElement('span');
      s.className = 'spark';
      s.textContent = Math.random() < 0.5 ? '\u2764' : '\u2728';
      var size = 10 + Math.random() * 18;
      s.style.fontSize = size + 'px';
      s.style.color = ['#ff6fa5', '#ffd0e2', '#ff2e63', '#ffb3d1', '#e6cd93'][(Math.random() * 5) | 0];
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      s.style.transform = 'translate(-50%,-50%)';
      fx.appendChild(s);

      var ang = Math.random() * Math.PI * 2;
      var dist = 60 + Math.random() * 150;
      var dx = Math.cos(ang) * dist;
      var dy = Math.sin(ang) * dist;
      var dur = 700 + Math.random() * 700;

      s.animate(
        [
          { transform: 'translate(-50%,-50%) scale(0.4)', opacity: 1 },
          { transform: 'translate(' + (dx - 50) + '%,' + (dy - 50) + '%) scale(' + (0.8 + Math.random()) + ')', opacity: 0 }
        ],
        { duration: dur, easing: 'cubic-bezier(.15,.6,.3,1)' }
      ).onfinish = (function (el) { return function () { el.remove(); }; })(s);
    }
  }

  /* sparkle cursor trail (pointer devices only) */
  if (!reduceMotion && !isTouch) {
    var lastTrail = 0;
    document.addEventListener('mousemove', function (e) {
      var now = Date.now();
      if (now - lastTrail < 55) return;
      lastTrail = now;
      var t = document.createElement('span');
      t.className = 'trail';
      t.textContent = '\u2727';
      t.style.left = (e.clientX + (Math.random() * 12 - 6)) + 'px';
      t.style.top = (e.clientY + (Math.random() * 12 - 6)) + 'px';
      document.body.appendChild(t);
      t.animate(
        [
          { transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', opacity: 1 },
          { transform: 'translate(-50%,-50%) scale(0.2) rotate(120deg) translateY(-18px)', opacity: 0 }
        ],
        { duration: 750, easing: 'ease-out' }
      ).onfinish = function () { t.remove(); };
    });
  }

  /* ============ element references ============ */
  var stage = document.getElementById('stage');
  var envelope = document.getElementById('envelope');
  var scene = document.getElementById('scene');
  var tilt = document.getElementById('tilt');
  var letter = document.getElementById('letter');
  var hint = document.getElementById('hint');
  var seal = document.getElementById('seal');
  var secret = document.getElementById('secret');
  var signature = document.getElementById('signature');
  var proposal = document.getElementById('proposal');
  var answer = document.getElementById('answer');
  var btns = document.getElementById('btns');
  var noBtn = document.getElementById('no');
  var flash = document.getElementById('flash');

  /* ============ parallax on the letter ============ */
  var parX = 0, parY = 0, parRaf = 0;
  function applyParallax() {
    parRaf = 0;
    tilt.style.transform = 'rotateY(' + parX.toFixed(2) + 'deg) rotateX(' + parY.toFixed(2) + 'deg)';
  }
  document.addEventListener('mousemove', function (e) {
    if (reduceMotion) return;
    if (!scene.classList.contains('show')) return;
    var cx = (e.clientX / window.innerWidth - 0.5);
    var cy = (e.clientY / window.innerHeight - 0.5);
    parX = cx * 7;
    parY = -cy * 7;
    if (!parRaf) parRaf = requestAnimationFrame(applyParallax);
  });

  /* ============ intro: open the envelope ============ */
  var opened = false;

  envelope.addEventListener('click', openEnvelope);
  hint.addEventListener('click', openEnvelope);

  function openEnvelope() {
    if (opened) return;
    opened = true;
    try { startMusic(); } catch (err) {}
    envelope.classList.add('open');

    var r = envelope.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, reduceMotion ? 10 : 30);

    setTimeout(function () { envelope.classList.add('rising'); }, 480);
    setTimeout(function () {
      stage.classList.add('gone');
      scene.classList.add('show');
      letter.classList.add('show');
    }, 1150);
    setTimeout(startTyping, 1650);
  }

  /* ============ typewriter ============ */
  var skipTyping = false;
  document.addEventListener('click', function () { skipTyping = true; });

  function typeInto(el, tokens, speed, done) {
    el.classList.add('lit');
    el.innerHTML = '';
    el.classList.add('typing');
    var ti = 0, ci = 0;
    var span = document.createElement('span');
    if (tokens[0] && tokens[0].cls) span.className = tokens[0].cls;
    el.appendChild(span);

    function step() {
      if (ti >= tokens.length) { el.classList.remove('typing'); done && done(); return; }

      if (skipTyping) {
        while (ti < tokens.length) {
          span.textContent += tokens[ti].text.slice(ci);
          ti++; ci = 0;
          if (ti < tokens.length) {
            span = document.createElement('span');
            if (tokens[ti].cls) span.className = tokens[ti].cls;
            el.appendChild(span);
          }
        }
        el.classList.remove('typing');
        done && done();
        return;
      }

      var t = tokens[ti];
      if (ci < t.text.length) {
        span.textContent += t.text[ci++];
        setTimeout(step, speed);
      } else {
        ti++; ci = 0;
        if (ti < tokens.length) {
          span = document.createElement('span');
          if (tokens[ti].cls) span.className = tokens[ti].cls;
          el.appendChild(span);
        }
        step();
      }
    }
    step();
  }

  function txt(s, cls) { return { text: s, cls: cls || null }; }

  var P1 = [txt('From the moment you walked into my life, everything changed. The world became softer, brighter, and infinitely more beautiful. You are the first thought in my morning and the last whisper of my night.')];
  var P2 = [txt('I love the way you laugh \u2014 it sounds like the kind of music that makes my heart forget how to stay still. I love the way you look at me, as if I am the answer to a question you have carried for a lifetime. With you, even silence feels like a conversation.')];
  var P3 = [txt('I promise to hold your hand through every storm, to celebrate every little victory, and to love you a little more with every sunrise. Distance, time, and everything in between \u2014 none of it stands a chance against what I feel for you. You are not just my love; you are my '), txt('home', 'highlight'), txt('.')];
  var P4 = [txt('So here I am, heart wide open, telling you the truest thing I know: '), txt('I am yours, completely, endlessly, always.', 'highlight')];

  function startTyping() {
    skipTyping = reduceMotion;
    typeInto(document.getElementById('dear'), [txt('My Dearest Love,')], 55, function () {
      setTimeout(function () {
        typeInto(document.getElementById('p1'), P1, 16, function () {
          typeInto(document.getElementById('p2'), P2, 16, function () {
            typeInto(document.getElementById('p3'), P3, 16, function () {
              typeInto(document.getElementById('p4'), P4, 16, function () {
                signature.classList.add('show');
                hint.setAttribute('data-done', '1');
                setTimeout(function () { proposal.classList.add('show'); }, 1400);
                setTimeout(revealGame, 2400);
              });
            });
          });
        });
      }, 500);
    });
  }

  /* ============ secret: long-press the wax seal ============ */
  var holdTimer = null;
  seal.addEventListener('mousedown', startHold);
  seal.addEventListener('touchstart', startHold, { passive: true });
  seal.addEventListener('mouseup', cancelHold);
  seal.addEventListener('mouseleave', cancelHold);
  seal.addEventListener('touchend', cancelHold);

  function startHold() {
    cancelHold();
    holdTimer = setTimeout(showSecret, 1200);
  }
  function cancelHold() { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } }

  function showSecret() {
    secret.innerHTML = '<strong>A secret&hellip;</strong> I have been secretly practicing how to make you smile today &mdash; and every day since I met you. It is already working, isn\'t it? &#128521;';
    secret.classList.add('show');
    var r = seal.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, reduceMotion ? 10 : 30);
  }

  /* ============ proposal twist: the runaway "No" ============ */
  noBtn.addEventListener('mouseenter', runAway);
  noBtn.addEventListener('click', runAway);
  noBtn.addEventListener('touchstart', function (e) { e.preventDefault(); runAway(); }, { passive: false });

  function runAway() {
    noBtn.style.position = 'fixed';
    var w = window.innerWidth, h = window.innerHeight;
    noBtn.style.left = (20 + Math.random() * Math.max(40, w - 160)) + 'px';
    noBtn.style.top = (20 + Math.random() * Math.max(40, h - 80)) + 'px';
    burst(parseFloat(noBtn.style.left) + 40, parseFloat(noBtn.style.top) + 20, 6);
  }

  document.getElementById('yes').addEventListener('click', function () {
    answer.textContent = 'I knew it \u2014 forever it is. \u2764';
    answer.classList.add('show');
    btns.style.display = 'none';

    if (flash) {
      flash.classList.remove('go');
      void flash.offsetWidth;
      flash.classList.add('go');
    }

    var r = letter.getBoundingClientRect();
    for (var k = 0; k < 8; k++) {
      (function (k) {
        setTimeout(function () {
          burst(r.left + Math.random() * r.width, r.top + r.height * (0.3 + Math.random() * 0.6), reduceMotion ? 10 : 22);
        }, k * 160);
      })(k);
    }
    celebrate();
  });

  function celebrate() {
    var heartCountC = reduceMotion ? 0 : 34;
    for (var i = 0; i < heartCountC; i++) {
      (function (i) {
        setTimeout(function () {
          var s = document.createElement('span');
          s.className = 'petal-burst';
          s.textContent = '\u2764';
          var size = 12 + Math.random() * 26;
          s.style.fontSize = size + 'px';
          s.style.color = ['#ff6fa5', '#ff2e63', '#ffb3d1', '#ffd0e2', '#e6cd93'][(Math.random() * 5) | 0];
          s.style.left = (Math.random() * 100) + 'vw';
          s.style.top = '105vh';
          s.style.opacity = '0.95';
          fx.appendChild(s);
          s.animate(
            [
              { transform: 'translate(-50%,0) rotate(0deg)', opacity: 1 },
              { transform: 'translate(-50%,-' + (80 + Math.random() * 40) + 'vh) rotate(' + (Math.random() * 720 - 360) + 'deg)', opacity: 0 }
            ],
            { duration: 3000 + Math.random() * 2500, easing: 'cubic-bezier(.2,.6,.3,1)' }
          ).onfinish = (function (el) { return function () { el.remove(); }; })(s);
        }, i * 80);
      })(i);
    }

    var petalCountC = reduceMotion ? 0 : 22;
    for (var pj = 0; pj < petalCountC; pj++) {
      (function (pj) {
        setTimeout(function () {
          var s2 = document.createElement('span');
          s2.className = 'petal-burst';
          var sz = 10 + Math.random() * 16;
          s2.style.width = sz + 'px';
          s2.style.height = sz + 'px';
          s2.style.borderRadius = '100% 0 100% 0';
          s2.style.background = 'linear-gradient(135deg,#ff9ec0,#e0457f 55%,#b3184a)';
          s2.style.left = (Math.random() * 100) + 'vw';
          s2.style.top = '106vh';
          s2.style.opacity = '0.95';
          fx.appendChild(s2);
          s2.animate(
            [
              { transform: 'translate(-50%,0) rotate(0deg)', opacity: 1 },
              { transform: 'translate(-50%,-' + (70 + Math.random() * 40) + 'vh) rotate(' + (Math.random() * 720 - 360) + 'deg)', opacity: 0 }
            ],
            { duration: 3200 + Math.random() * 2600, easing: 'cubic-bezier(.2,.6,.3,1)' }
          ).onfinish = (function (el) { return function () { el.remove(); }; })(s2);
        }, pj * 100);
      })(pj);
    }
  }

  /* ============ Background music: "Can't Help Falling In Love" ============ */
  var musicBtn = document.getElementById('music');
  var musicOn = false;
  var song = null;

  function getSong() {
    if (!song) {
      song = new Audio('Can-t-Help-Falling-In-Love-The-Most-Beautiful-Version.m4a');
      song.loop = true;
      song.preload = 'auto';
      song.volume = 0;
    }
    return song;
  }

  musicBtn.addEventListener('click', function () {
    if (musicOn) stopMusic(); else startMusic();
  });

  function fadeVolume(el, target, sec) {
    if (el._fade) { clearInterval(el._fade); el._fade = null; }
    var steps = Math.max(1, Math.round(sec * 30));
    var from = el.volume, i = 0;
    el._fade = setInterval(function () {
      i++;
      el.volume = Math.min(1, Math.max(0, from + (target - from) * (i / steps)));
      if (i >= steps) { clearInterval(el._fade); el._fade = null; }
    }, 1000 / 30);
  }

  function startMusic() {
    if (musicOn) return;
    var el = getSong();
    musicOn = true;
    musicBtn.classList.add('on');
    var p = el.play();
    if (p && p.catch) {
      p.catch(function () { musicOn = false; musicBtn.classList.remove('on'); });
    }
    fadeVolume(el, 0.9, 2.2);
  }

  function stopMusic() {
    if (!musicOn) return;
    musicOn = false;
    musicBtn.classList.remove('on');
    var el = getSong();
    fadeVolume(el, 0, 0.7);
    setTimeout(function () { if (!musicOn) { try { el.pause(); } catch (e) {} } }, 720);
  }

  /* ============ love game: "Catch My Love" ============ */
  var gameBtn = document.getElementById('game');
  var overlay = document.getElementById('gameOverlay');
  var canvas = document.getElementById('gameCanvas');
  var gctx = canvas.getContext('2d');
  var gScoreEl = document.getElementById('gScore');
  var gTimeEl = document.getElementById('gTime');
  var gLivesEl = document.getElementById('gLives');
  var gameScreen = document.getElementById('gameScreen');
  var gameSub = document.getElementById('gameSub');
  var gameStartBtn = document.getElementById('gameStart');
  var gameCloseBtn = document.getElementById('gameClose');

  var G = {
    state: 'idle', score: 0, lives: 3, timeLeft: 40,
    items: [], fx: [], bg: [],
    catcher: { x: 0, y: 0, w: 70, h: 28, target: 0 },
    last: 0, spawnT: 0, elapsed: 0, shake: 0,
    raf: 0, W: 0, H: 0, dpr: 1
  };

  function revealGame() { if (gameBtn) gameBtn.classList.add('show'); }

  /* pre-baked sprites so the game loop never rebuilds gradients/shadows per frame */
  var SP_R = 34, SP_PAD = 20, SP_BOX = (SP_R + SP_PAD) * 2;
  var SPRITES = null, CAT = null, bgCache = null;

  function bakeSprite(drawFn) {
    var cv = document.createElement('canvas');
    cv.width = SP_BOX; cv.height = SP_BOX;
    var x = cv.getContext('2d');
    x.translate(SP_BOX / 2, SP_BOX / 2);
    drawFn(x, SP_R);
    return cv;
  }

  function buildSprites() {
    if (SPRITES) return;
    SPRITES = {};
    SPRITES.heart = bakeSprite(function (x, s) {
      x.shadowColor = 'rgba(255,90,150,0.85)'; x.shadowBlur = 14;
      drawHeart(x, s, '#ff5c8a', '#a01040');
    });
    SPRITES.petal = bakeSprite(function (x, s) {
      x.shadowColor = 'rgba(255,120,170,0.7)'; x.shadowBlur = 10;
      drawPetal(x, s, '#ffb3d1', '#c01f5e');
    });
    SPRITES.gold = bakeSprite(function (x, s) {
      x.shadowColor = 'rgba(246,233,198,0.95)'; x.shadowBlur = 20;
      drawHeart(x, s, '#f6e9c6', '#c9a86a');
      x.shadowBlur = 0;
      x.fillStyle = 'rgba(255,255,255,0.95)';
      sparkleStar(x, s * 0.55, -s * 0.55, s * 0.26);
    });
    SPRITES.broken = bakeSprite(function (x, s) {
      x.shadowColor = 'rgba(120,90,100,0.45)'; x.shadowBlur = 12;
      drawHeart(x, s, '#6b5560', '#3d2b33');
      x.shadowBlur = 0;
      x.strokeStyle = 'rgba(20,3,9,0.85)';
      x.lineWidth = Math.max(1.5, s * 0.12);
      x.beginPath();
      x.moveTo(0, -s * 0.7); x.lineTo(-s * 0.2, 0); x.lineTo(s * 0.15, s * 0.2); x.lineTo(-s * 0.05, s * 0.8);
      x.stroke();
    });
  }

  function buildCatcher() {
    if (CAT) return;
    var bsW = 160, bsH = bsW * 0.42, pad = 48;
    var cw = Math.round(bsW + pad * 2), ch = Math.round(bsH * 2.1 + pad * 2);
    var cv = document.createElement('canvas');
    cv.width = cw; cv.height = ch;
    var x = cv.getContext('2d');
    var cx = cw / 2, rimY = pad + bsH;
    var gg = x.createRadialGradient(cx, rimY, 0, cx, rimY, bsW * 0.9);
    gg.addColorStop(0, 'rgba(230,205,147,0.35)');
    gg.addColorStop(1, 'rgba(230,205,147,0)');
    x.fillStyle = gg; x.beginPath(); x.arc(cx, rimY, bsW * 0.9, 0, 6.283); x.fill();

    var bg = x.createLinearGradient(cx - bsW * 0.7, rimY, cx + bsW * 0.7, rimY + bsH);
    bg.addColorStop(0, '#f6e9c6'); bg.addColorStop(0.5, '#e6cd93'); bg.addColorStop(1, '#c9a86a');
    x.beginPath();
    x.moveTo(cx - bsW * 0.7, rimY);
    x.quadraticCurveTo(cx, rimY + bsH * 2.0, cx + bsW * 0.7, rimY);
    x.quadraticCurveTo(cx, rimY + bsH * 0.35, cx - bsW * 0.7, rimY);
    x.closePath();
    x.fillStyle = bg; x.shadowColor = 'rgba(246,233,198,0.8)'; x.shadowBlur = 18; x.fill(); x.shadowBlur = 0;

    x.strokeStyle = 'rgba(255,255,255,0.85)'; x.lineWidth = 2;
    x.beginPath();
    x.moveTo(cx - bsW * 0.7, rimY);
    x.quadraticCurveTo(cx, rimY + bsH * 0.35, cx + bsW * 0.7, rimY);
    x.stroke();

    x.save();
    x.translate(cx, rimY + bsH * 0.15);
    x.shadowColor = 'rgba(192,31,94,0.7)'; x.shadowBlur = 10;
    drawHeart(x, bsW * 0.14, '#ff6fa5', '#c01f5e');
    x.restore();

    CAT = { cv: cv, bsW: bsW, rimY: rimY };
  }

  function buildBg() {
    var cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(G.W * G.dpr));
    cv.height = Math.max(1, Math.round(G.H * G.dpr));
    var x = cv.getContext('2d');
    var w = cv.width, h = cv.height;
    var gr = x.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#1a0410'); gr.addColorStop(0.5, '#2a0620'); gr.addColorStop(1, '#3d0b2e');
    x.fillStyle = gr; x.fillRect(0, 0, w, h);
    var rg = x.createRadialGradient(w / 2, h * 0.15, 0, w / 2, h * 0.15, Math.max(w, h) * 0.72);
    rg.addColorStop(0, 'rgba(255,120,170,0.16)'); rg.addColorStop(1, 'rgba(255,120,170,0)');
    x.fillStyle = rg; x.fillRect(0, 0, w, h);
    bgCache = cv;
  }

  function drawSprite(ctx, sprite, x, y, r, rot) {
    var w = SP_BOX * (r / SP_R);
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    ctx.drawImage(sprite, -w / 2, -w / 2, w, w);
    ctx.restore();
  }

  function resizeGame() {
    var w = overlay.clientWidth || window.innerWidth;
    var h = overlay.clientHeight || window.innerHeight;
    G.dpr = Math.min(1.5, window.devicePixelRatio || 1);
    G.W = w; G.H = h;
    canvas.width = Math.round(w * G.dpr);
    canvas.height = Math.round(h * G.dpr);
    gctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
    gctx.imageSmoothingEnabled = true;
    G.catcher.w = Math.max(56, Math.min(104, w * 0.17));
    G.catcher.h = G.catcher.w * 0.42;
    G.catcher.y = h - Math.max(48, h * 0.1);
    if (G.state !== 'playing') { G.catcher.x = w / 2; G.catcher.target = w / 2; }
    buildBg();
  }

  function resetGame(full) {
    G.score = 0; G.lives = 3; G.timeLeft = 40; G.elapsed = 0;
    G.items = []; G.fx = []; G.spawnT = 0; G.shake = 0;
    G.catcher.x = G.W / 2; G.catcher.target = G.W / 2;
    if (full) {
      G.bg = [];
      var n = reduceMotion ? 0 : (isTouch ? 10 : 18);
      for (var i = 0; i < n; i++) {
        G.bg.push({ x: Math.random() * G.W, y: Math.random() * G.H, s: 6 + Math.random() * 16, v: 10 + Math.random() * 24, r: Math.random() * 6.28, rv: (Math.random() - 0.5) * 0.8, a: 0.05 + Math.random() * 0.12 });
      }
    }
    updateHud();
  }

  function updateHud() {
    gScoreEl.textContent = G.score;
    gTimeEl.textContent = Math.max(0, Math.ceil(G.timeLeft));
    var s = '';
    for (var i = 0; i < 3; i++) s += (i < G.lives ? '\u2764' : '\u2661');
    gLivesEl.textContent = s;
  }

  function openGame() {
    overlay.classList.add('show');
    buildSprites();
    buildCatcher();
    resizeGame();
    resetGame(true);
    G.state = 'idle';
    gameScreen.classList.remove('hide');
    gameSub.innerHTML = 'Move to catch the falling hearts &amp; petals &mdash; and dodge the broken ones. You have 40 seconds.';
    gameStartBtn.textContent = 'Start';
    G.last = performance.now();
    if (!G.raf) G.raf = requestAnimationFrame(loop);
  }

  function closeGame() {
    G.state = 'idle';
    if (G.raf) { cancelAnimationFrame(G.raf); G.raf = 0; }
    overlay.classList.remove('show');
  }

  function startGame() {
    resetGame(false);
    G.state = 'playing';
    gameScreen.classList.add('hide');
    G.last = performance.now();
    if (!G.raf) G.raf = requestAnimationFrame(loop);
  }

  function endGame(byLives) {
    if (G.state !== 'playing') return;
    G.state = 'over';
    var msg;
    if (byLives) msg = 'A few broke your heart\u2026 but mine is forever yours.';
    else if (G.score >= 300) msg = 'A heart absolutely full of love \u2014 you caught them all so beautifully.';
    else if (G.score >= 150) msg = 'So much love caught today. You have the softest hands.';
    else msg = 'Every heart you caught is a moment I would choose again.';
    gameSub.innerHTML = msg + '<br>Final score: <b>' + G.score + '</b>';
    gameScreen.classList.remove('hide');
    gameStartBtn.textContent = 'Play again';
    updateHud();
  }

  function loop(now) {
    G.raf = requestAnimationFrame(loop);
    var dt = Math.min(0.05, (now - G.last) / 1000 || 0);
    G.last = now;
    if (G.state === 'playing') updateGame(dt);
    renderFrame(dt);
  }

  function updateGame(dt) {
    G.elapsed += dt;
    G.timeLeft -= dt;
    G.spawnT -= dt;
    if (G.spawnT <= 0) { G.spawnT = Math.max(0.34, 0.8 - G.elapsed * 0.012); spawnItem(); }

    var smooth = Math.min(1, dt * 14);
    G.catcher.x += (G.catcher.target - G.catcher.x) * smooth;
    G.catcher.x = Math.max(G.catcher.w / 2, Math.min(G.W - G.catcher.w / 2, G.catcher.x));

    if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 3);

    for (var i = G.items.length - 1; i >= 0; i--) {
      var it = G.items[i];
      it.y += it.vy * dt;
      it.x += Math.sin((G.elapsed + it.phase) * it.swayF) * it.sway * dt;
      it.rot += it.rv * dt;

      var inReach = it.y > G.catcher.y - it.r * 0.6 && it.y < G.catcher.y + G.catcher.h * 1.8;
      if (inReach && Math.abs(it.x - G.catcher.x) < (G.catcher.w * 0.62 + it.r)) {
        caught(it);
        G.items.splice(i, 1);
        continue;
      }
      if (it.y > G.H + 70) G.items.splice(i, 1);
    }

    if (G.timeLeft <= 0) endGame(false);
    updateHud();
  }

  function spawnItem() {
    var r = Math.random(), type;
    if (r < 0.60) type = 'heart';
    else if (r < 0.84) type = 'petal';
    else if (r < 0.92) type = 'gold';
    else type = 'broken';
    var base = type === 'gold' ? 20 : (type === 'petal' ? 15 : 18);
    var size = base * (0.8 + Math.random() * 0.5);
    G.items.push({
      type: type,
      x: 34 + Math.random() * Math.max(10, G.W - 68),
      y: -40,
      r: size,
      vy: (110 + Math.random() * 60) + G.elapsed * 3.2,
      sway: type === 'petal' ? 32 : 12,
      swayF: 1.2 + Math.random(),
      phase: Math.random() * 6.28,
      rot: Math.random() * 6.28,
      rv: (Math.random() - 0.5) * 2
    });
  }

  function caught(it) {
    var pts = it.type === 'heart' ? 10 : it.type === 'petal' ? 5 : it.type === 'gold' ? 25 : 0;
    if (it.type === 'broken') {
      G.lives--; G.shake = 1;
      addFx(it.x, it.y, '#9a6b7a', 7, 0);
    } else {
      G.score += pts;
      addFx(it.x, it.y, it.type === 'gold' ? '#f6e9c6' : '#ff6fa5', it.type === 'gold' ? 16 : 10, pts);
    }
    if (G.lives <= 0) endGame(true);
  }

  function addFx(x, y, color, n, pts) {
    G.fx.push({ kind: 'ring', x: x, y: y, t: 0, life: 0.5, color: color });
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.28, sp = 40 + Math.random() * 130;
      G.fx.push({ kind: 'spark', x: x, y: y, t: 0, life: 0.6 + Math.random() * 0.4, color: color, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, s: 1.5 + Math.random() * 2.5 });
    }
    if (pts) G.fx.push({ kind: 'text', x: x, y: y, t: 0, life: 0.8, color: color, text: '+' + pts });
    if (G.fx.length > 150) G.fx.splice(0, G.fx.length - 150);
  }

  function drawHeart(ctx, s, c1, c2) {
    var g = ctx.createLinearGradient(0, -s, 0, s);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.beginPath();
    ctx.moveTo(0, s * 0.9);
    ctx.bezierCurveTo(-s * 1.4, -s * 0.15, -s * 0.7, -s * 1.15, 0, -s * 0.45);
    ctx.bezierCurveTo(s * 0.7, -s * 1.15, s * 1.4, -s * 0.15, 0, s * 0.9);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawPetal(ctx, s, c1, c2) {
    var g = ctx.createLinearGradient(-s, -s, s, s);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.bezierCurveTo(s, -s * 0.4, s * 0.7, s * 0.7, 0, s);
    ctx.bezierCurveTo(-s * 0.7, s * 0.7, -s, -s * 0.4, 0, -s);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();
  }

  function sparkleStar(ctx, x, y, r) {
    ctx.beginPath();
    for (var i = 0; i < 8; i++) {
      var rad = i % 2 ? r * 0.42 : r;
      var a = (Math.PI / 4) * i - Math.PI / 2;
      var px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawItem(ctx, it) {
    if (!SPRITES) return;
    drawSprite(ctx, SPRITES[it.type], it.x, it.y, it.r, it.type === 'petal' ? it.rot : it.rot * 0.5);
  }

  function drawCatcher(ctx) {
    if (!CAT) return;
    var c = G.catcher;
    var scale = c.w / CAT.bsW;
    ctx.drawImage(CAT.cv, c.x - (CAT.cv.width / 2) * scale, c.y - CAT.rimY * scale, CAT.cv.width * scale, CAT.cv.height * scale);
  }

  function drawFx(ctx, f) {
    var p = f.t / f.life;
    ctx.save();
    if (f.kind === 'ring') {
      ctx.globalAlpha = Math.max(0, 1 - p);
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(f.x, f.y, 12 + p * 42, 0, 6.283);
      ctx.stroke();
    } else if (f.kind === 'spark') {
      ctx.globalAlpha = Math.max(0, 1 - p);
      ctx.fillStyle = f.color;
      ctx.beginPath();
      ctx.arc(f.x + f.vx * f.t, f.y + f.vy * f.t + 90 * f.t * f.t, f.s * (1 - p * 0.5), 0, 6.283);
      ctx.fill();
    } else if (f.kind === 'text') {
      ctx.globalAlpha = Math.max(0, 1 - p);
      ctx.fillStyle = f.color;
      ctx.font = '600 18px "Playfair Display", Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y - p * 44);
    }
    ctx.restore();
  }

  function renderFrame(dt) {
    var ctx = gctx, W = G.W, H = G.H;
    if (bgCache) ctx.drawImage(bgCache, 0, 0, W, H);
    else { ctx.fillStyle = '#1a0410'; ctx.fillRect(0, 0, W, H); }

    for (var b = 0; b < G.bg.length; b++) {
      var bo = G.bg[b];
      ctx.globalAlpha = bo.a;
      drawSprite(ctx, SPRITES.petal, bo.x, bo.y, bo.s * 0.5, bo.r);
      bo.y += bo.v * dt;
      bo.r += bo.rv * dt;
      if (bo.y > H + 30) { bo.y = -30; bo.x = Math.random() * W; }
    }
    ctx.globalAlpha = 1;

    var shake = G.shake > 0 ? G.shake * 7 : 0;
    if (shake) { ctx.save(); ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); }

    for (var i = 0; i < G.items.length; i++) drawItem(ctx, G.items[i]);
    drawCatcher(ctx);

    for (var f = G.fx.length - 1; f >= 0; f--) {
      var ff = G.fx[f];
      ff.t += dt;
      if (ff.t >= ff.life) { G.fx.splice(f, 1); continue; }
      drawFx(ctx, ff);
    }

    if (shake) ctx.restore();
  }

  function setGameTarget(clientX) {
    var rect = canvas.getBoundingClientRect();
    G.catcher.target = clientX - rect.left;
  }

  canvas.addEventListener('pointermove', function (e) { if (G.state === 'playing') setGameTarget(e.clientX); });
  canvas.addEventListener('pointerdown', function (e) { if (G.state === 'playing') setGameTarget(e.clientX); });

  document.addEventListener('keydown', function (e) {
    if (!overlay.classList.contains('show')) return;
    if (e.key === 'Escape') { closeGame(); return; }
    if (G.state !== 'playing') return;
    if (e.key === 'ArrowLeft') G.catcher.target = Math.max(G.catcher.w / 2, G.catcher.target - 70);
    if (e.key === 'ArrowRight') G.catcher.target = Math.min(G.W - G.catcher.w / 2, G.catcher.target + 70);
  });

  window.addEventListener('resize', function () {
    if (overlay.classList.contains('show')) resizeGame();
  });

  gameBtn.addEventListener('click', openGame);
  gameStartBtn.addEventListener('click', function () { if (G.state !== 'playing') startGame(); });
  gameCloseBtn.addEventListener('click', closeGame);

  /* ============ ambient clicks ============ */
  document.addEventListener('click', function (e) {
    if (overlay.classList.contains('show')) return;
    if (e.target.closest('.btn') || e.target.closest('.music') || e.target.closest('.ibtn')) return;
    burst(e.clientX, e.clientY, 10);
  });
})();
</script>
</body>
</html>
